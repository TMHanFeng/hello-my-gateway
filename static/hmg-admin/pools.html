<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型池 · HMG Admin</title>
<script>
/* 主题引导：渲染前定 data-theme，防闪白（跟随系统 → localStorage 手动值优先） */
(function(){try{var t=localStorage.getItem('hmg_theme');if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<link rel="stylesheet" href="/hmg-admin/assets/hmg.css?v=__GATEWAY_VERSION__">
<style>
/* ── 本页私有：池卡片 / 池条目 / 阈值控件 ── */
.pool-card-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.pool-card-sub { color: var(--ink-subtle); font-size: 12px; margin-top: 2px; }
.pool-items { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.pool-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  background: var(--canvas); border: 1px solid var(--hairline); border-radius: 8px;
  font-size: 13px; min-height: 36px;
  transition: background-color 130ms ease, border-color 130ms ease;
}
.pool-item:hover { background: var(--wash); border-color: var(--hairline-strong); }
.pool-item[draggable="true"] { cursor: grab; }
.pool-item .pi-id { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
.pool-item .drag { cursor: grab; color: var(--ink-tertiary); opacity: .55; transition: opacity 150ms ease; }
.pool-item:hover .drag { opacity: 1; }
.pi-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.i-tip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-3); color: var(--ink-subtle); font-size: 10px; font-style: normal; cursor: help; flex: none; }
.i-tip::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; }  /* v2.17.13 命中区 15→25px */
.add-model-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.add-model-row select { flex: 1; min-width: 0; }
/* v2.17.12（工作单 §16.5）：池卡头控件两行分组——上排状态开关/阈值（同质），下排动作按钮（虚线分隔），
   替代 7 个异质控件一字长龙零分组；窄屏整体转左对齐铺满。 */
.pool-head-ctls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.pool-switches, .pool-actions { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; justify-content: flex-end; }
.pool-actions { padding-top: 8px; border-top: 1px dashed var(--hairline); }
/* v2.17.12：note-box 从「整行加粗底色条」降为安静左线注（操作说明不占黄金位；完整解释仍在开关 title 里） */
.note-box { font-size: 12px; line-height: 1.6; color: var(--ink-subtle); border-left: 2px solid var(--hairline-strong); padding: 2px 0 2px 10px; margin-bottom: 8px; }
.threshold-ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-subtle); }
.th-input-wrap { display: inline-flex; align-items: center; border: 1px solid var(--hairline); border-radius: 6px; background: var(--surface-1); overflow: hidden; }
.th-input { width: 72px; border: none; background: transparent; padding: 5px 8px; font-size: 12.5px; color: var(--ink); }
.th-input:focus { outline: none; }
.th-unit { padding-right: 8px; font-size: 11.5px; color: var(--ink-tertiary); }
.th-hint { font-size: 11.5px; color: var(--ink-tertiary); }
.th-hint.ok { color: var(--ok-ink); } .th-hint.warn { color: var(--warn-ink); }
.sw-label { font-size: 12.5px; color: var(--ink-subtle); margin-left: 2px; }
.single-banner { font-size: 13px; color: var(--ink-muted); background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fb-check { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
.fb-check input { accent-color: var(--accent); }
@media (max-width: 767px) {
  .add-model-row { flex-direction: column; align-items: stretch; }
  .pool-head-ctls { align-items: stretch; width: 100%; }
  .pool-switches, .pool-actions { justify-content: flex-start; }
}
</style>
</head>
<body data-page="pools">
<div id="hmg-topbar"></div>
<aside id="hmg-sidebar"></aside>
<div id="hmg-drawermask"></div>
<main class="hmg-main">
  <div class="page-head">
    <h1>模型池</h1><span class="sub">拖拽 ⠿ 调整优先级（手机端点一下条目/池卡片即上移一格）；池名即调用名（model="池名"）。auto 为内置池固定顶端，兜底池固定末尾</span><span class="sp"></span>
    <div class="toolbar">
      <div class="seg" id="pool-mode-seg">
        <button class="on" onclick="setPoolMode('normal', this)">普通池</button>
        <button onclick="setPoolMode('user', this)">专属池</button>
      </div>
      <button class="btn btn-ghost" onclick="grpOpenSettings()" title="分组收纳设置（模型管理 / 模型池）">分组</button>
      <button class="btn btn-primary" onclick="showAddPool()">＋ 新增池</button>
    </div>
  </div>
  <div id="pool-list" class="stagger"><div class="empty">加载中…</div></div>
</main>
<script src="/hmg-admin/assets/hmg.js?v=__GATEWAY_VERSION__"></script>
<script>
"use strict";
HMG.renderShell();
/* ═══════════ 模型池页（业务逻辑自 hfadmin 移植，API 零改动）═══════════ */
const api = HMG.api, esc = HMG.esc, jsq = HMG.jsq, pathEnc = HMG.pathEnc, toast = HMG.toast;
let modelLookup = {}, providerLookup = {}, poolLookup = {};
let poolMode = "normal";
let PC_STATE = {};   // 插件可见性：switch_pool 停用 → 池卡片 Switch 开关隐藏
let poolModal = null, singleModal = null, fbModal = null;
function setInnerIfChanged(el, html) {
  if (el.__lastHtml === html) return false;
  el.__lastHtml = html;
  el.innerHTML = html;
  return true;
}
function protocolLabel(p) { return ({ openai: "OpenAI Compatible", anthropic: "Anthropic", openai_responses: "OpenAI Responses" })[p] || p; }
async function refreshPluginState() {
  const d = await api("/admin/plugins");
  if (d) (d.plugins || []).forEach(p => { PC_STATE[p.id] = !!p.enabled; });
}

function setPoolMode(mode, btn) {
  poolMode = mode;
  document.querySelectorAll("#pool-mode-seg button").forEach(b => b.classList.toggle("on", b === btn));
  loadPools();
}

async function loadPools() {
  const [pdata, mdata, provdata] = await Promise.all([api("/admin/pools"), api("/admin/models"), api("/admin/providers")]);
  if (!pdata || !mdata) return;
  modelLookup = {}; mdata.models.forEach(m => modelLookup[m.id] = m);
  providerLookup = {}; if (provdata) provdata.providers.forEach(p => providerLookup[p.id] = p);
  poolLookup = pdata.pools;

  // 按后端 pool_order 排序（JS 的 Object.keys 会把纯数字池名按整数键规则提前，故显式用有序数组渲染）
  const _orderList = pdata.pool_order && pdata.pool_order.length
    ? pdata.pool_order
    : Object.keys(pdata.pools);
  const entries = _orderList
    .filter(name => name in pdata.pools)
    .map(name => [name, pdata.pools[name]])
    .filter(([name, pool]) => {
      const isDedicated = !!pool.owner_key_id;
      return poolMode === "user" ? isDedicated : !isDedicated;
    });
  if (_orderList !== Object.keys(pdata.pools)) {
    const seen = new Set(entries.map(e => e[0]));
    Object.entries(pdata.pools).forEach(([n, p]) => {
      if (!seen.has(n)) {
        const isDedicated = !!p.owner_key_id;
        if (poolMode === "user" ? isDedicated : !isDedicated) entries.push([n, p]);
      }
    });
  }

  const onceItem = !document.getElementById("pool-list").__poolAnim;
  document.getElementById("pool-list").__poolAnim = true;
  const grpOnP = grpSettings().pools;
  const poolItems = entries.map(([name, pool]) => {
    const ids = pool.model_ids || [];
    const availModels = mdata.models.filter(m => !ids.includes(m.id));
    const availPools = Object.keys(pdata.pools).filter(p => p !== name && p !== "兜底池" && !ids.includes("pool:" + p));
    // 下拉按供应商顺序分组排列；独立模型排最后
    const provSeq = provdata ? provdata.providers : [];
    const provIdx = new Map(provSeq.map((p, i) => [p.id, i]));
    const sortedModels = availModels.slice().sort((a, b) =>
      (a.provider_id && provIdx.has(a.provider_id) ? provIdx.get(a.provider_id) : 1e9) -
      (b.provider_id && provIdx.has(b.provider_id) ? provIdx.get(b.provider_id) : 1e9));
    const groupedModels = [];
    sortedModels.forEach(m => {
      const p = m.provider_id ? providerLookup[m.provider_id] : null;
      const label = p ? `${p.name}（${p.id}）` : "独立模型（未挂供应商）";
      if (!groupedModels.length || groupedModels[groupedModels.length - 1].label !== label) groupedModels.push({ label, items: [] });
      groupedModels[groupedModels.length - 1].items.push(m);
    });
    const modelOpts = groupedModels.map(g => `<optgroup label="${esc(g.label)}">${g.items.map(m => `<option value="${esc(m.id)}">${esc(m.id)}（${esc(m.name || "")}）</option>`).join("")}</optgroup>`).join("");
    const poolOpts = availPools.map(p => `<option value="pool:${esc(p)}">［池］${esc(p)}</option>`).join("");
    const isAuto = name === "auto";
    const isFallback = name === "兜底池";
    const isDedicated = !!pool.owner_key_id;
    const isDraggable = !isAuto;
    const dedicatedTag = isDedicated ? `<span class="badge" title="专属池：仅归属 Key#${esc(pool.owner_key_id)} 可用">专属池 · Key#${esc(pool.owner_key_id)}</span>` : "";
    const _cardHtml = `
    <div class="card" data-pool-card="${esc(name)}" ${isDraggable ? 'draggable="true"' : ""}>
      <div class="pool-card-head">
        <div class="grow" style="min-width:240px">
          <div class="card-title">
            ${isDraggable ? '<span class="drag-handle" style="cursor:grab" title="拖拽排序">⠿</span>' : '<span style="opacity:.3">⠿</span>'}
            ${HMG.avatar(name, true)} 池：${esc(name)} <span class="badge">model="${esc(name)}" 可调用</span>
            ${isFallback ? '<span class="badge badge-acc">兜底池</span>' : ""}
            ${isAuto ? '<span class="badge badge-acc">内置</span>' : ""}
            ${dedicatedTag}
          </div>
          <div class="pool-card-sub">${pool.strategy === "sequential" ? "策略：按序调用" : (pool.strategy || "")} · 共 ${ids.length} 项${pool.auto_order ? " · 自动择优" : ""}</div>
        </div>
        <div class="pool-head-ctls">
          <div class="pool-switches">
            <label class="switch" title="开启后：先排除不可用接口，再按实时延迟从低到高优先调用">
              <input type="checkbox" ${pool.auto_order ? "checked" : ""} onchange="toggleAutoOrder('${jsq(name)}', this.checked)"><i></i>
            </label><span class="sw-label">自动择优</span>
            <label class="switch" title="负载均衡：请求按池内顺序轮流分给每个模型/子池，避免集中在最快的模型上（与自动择优互斥）">
              <input type="checkbox" ${pool.load_balance ? "checked" : ""} onchange="toggleLoadBalance('${jsq(name)}', this.checked)"><i></i>
            </label><span class="sw-label">负载均衡</span>
            ${PC_STATE.switch_pool === false ? "" : `
            <label class="switch" title="Switch 切换：开启后客户端可 POST /池名 + switch=local|net 定向调用池内一侧（local=本地模型，net=其余云端模型）；要求池内两侧都有模型">
              <input type="checkbox" ${pool.switch_enabled ? "checked" : ""} onchange="togglePoolSwitch('${jsq(name)}', this.checked)"><i></i>
            </label><span class="sw-label" title="Switch 切换：开启后客户端可 POST /池名 + switch=local|net 定向调用池内一侧（local=本地模型，net=其余云端模型）">Switch</span>
            `}
            <span class="threshold-ctl" title="自动择优模式下，超过此延迟(ms)的模型排到末尾；0=不限">
              <span>阈值</span>
              <span class="th-input-wrap">
                <input type="number" class="th-input" min="0" step="100" value="${pool.slow_latency_threshold ?? 3000}"
                  onchange="setSlowThreshold('${jsq(name)}', this.value); updateThHint('${jsq(name)}', this.value); this.blur();">
                <span class="th-unit">ms</span>
              </span>
              <span class="th-hint" data-th-hint="${jsq(name)}"></span>
            </span>
          </div>
          <div class="pool-actions">
            ${(!isAuto && !isFallback && grpOnP) ? `<button class="btn btn-ghost btn-sm ic-btn" title="分组收纳" onclick="grpAssignMenu(event,'poolGroups','${jsq(name)}')">${HMG_ICONS.folder}</button>` : ""}
            <button class="btn btn-ghost btn-sm" onclick="speedPool('${jsq(name)}')">测速本池</button>
            ${isAuto ? `<button class="btn btn-secondary btn-sm" onclick="openSingleMode()">一键单模型</button>` : ""}
            ${isFallback ? `<button class="btn btn-ghost btn-sm" onclick="openFallbackTargets()">选择兜底对象</button>` : ""}
            ${(!isAuto && !isFallback && !isDedicated) ? `<button class="btn btn-ghost btn-sm" onclick="renamePool('${jsq(name)}')">重命名</button><button class="btn btn-danger btn-sm" onclick="delPool('${jsq(name)}')">删除池</button>` : ""}
          </div>
        </div>
      </div>
      <div id="single-active-${esc(name)}" class="single-banner hidden">
        ${HMG_ICONS.lock} 当前锁定模型：<strong class="mono" id="single-label-${esc(name)}"></strong>
        <button class="btn btn-danger btn-sm" onclick="clearSingleMode('${jsq(name)}')">${HMG_ICONS.unlock} 解除锁定</button>
      </div>
      ${pool.auto_order ? '<div class="note-box">自动择优已开启：先排除不可用接口（用量用尽 / RPM·TPM 触顶），再在可用接口中按调用延迟从低到高优先调用。下方显示顺序保持不变，关闭后按设定顺序调用。</div>' : ""}
      ${pool.load_balance ? '<div class="note-box">负载均衡已开启：每次请求按池内模型顺序轮流分配（第一个→第二个→…循环往复），请求均匀分摊到每个模型/子池。关闭后按设定顺序调用。</div>' : ""}
      ${(PC_STATE.switch_pool !== false && pool.switch_enabled) ? '<div class="note-box">Switch 切换已开启：客户端可 POST <b>/{池名}</b> 并带 <b>switch=local|net</b> 定向调用一侧——local=令牌类型为 local 的本地模型，net=其余云端模型。同侧全不可用时报 503，不会跨侧调用；每次路由在调用记录里显示为 switch:local / switch:net。</div>' : ""}
      <div class="pool-items" data-pool="${esc(name)}">
        ${ids.map((id, i) => poolItemHTML(name, id, i, onceItem)).join("") || '<div class="hint">该池为空，从下方添加接口或子池。</div>'}
      </div>
      <div class="add-model-row">
        <select id="addsel-${esc(name)}" class="inp">
          <option value="">— 选择要加入的接口 / 子池 —</option>
          <option value="" disabled>====模型接口====</option>
          ${modelOpts}
          <option value="" disabled>====子池====</option>
          ${poolOpts}
        </select>
        <button class="btn btn-secondary btn-sm" onclick="addToPool('${jsq(name)}')">＋ 加入</button>
      </div>
    </div>`;
    return { id: name, html: _cardHtml };
  });
  // auto 池固定分组区之外最顶、兜底池固定最底，中间池按自定义分组折叠展示
  let poolHtml;
  if (grpOnP && poolItems.length) {
    const autoIt = poolItems.find(x => x.id === "auto");
    const fbIt = poolItems.find(x => x.id === "兜底池");
    const mid = poolItems.filter(x => x.id !== "auto" && x.id !== "兜底池");
    poolHtml = (autoIt ? autoIt.html : "") + grpWrapHtml("poolGroups", mid) + (fbIt ? fbIt.html : "");
  } else {
    poolHtml = poolItems.map(i => i.html).join("") || '<div class="empty">当前模式下暂无模型池。</div>';
  }
  setInnerIfChanged(document.getElementById("pool-list"), poolHtml);
  bindDrag();
  bindPoolDrag();
  refreshSingleModeUI();
  // 初始化阈值 hint
  document.querySelectorAll(".threshold-ctl").forEach(ctl => {
    const hint = ctl.querySelector(".th-hint");
    if (!hint) return;
    const input = ctl.querySelector(".th-input");
    const name = hint.dataset.thHint;
    if (input && name) updateThHint(name, input.value);
  });
}

function poolItemHTML(name, id, i, animate = true) {
  const isPoolRef = id.startsWith("pool:");
  return `
  <div class="pool-item" draggable="true" data-id="${esc(id)}"${animate ? ` style="animation:hmgIn 280ms ease-out ${Math.min(i * 35, 400)}ms backwards"` : ""}>
    <span class="drag" title="拖拽排序">⠿</span>
    <span class="pi-id">${esc(id)}</span>
    <span class="pi-tags">
      ${isPoolRef ? '<span class="badge" title="嵌套子池">子池</span>' : (modelLookup[id] ? (modelLookup[id].is_free ? '<span class="badge badge-ok">免费</span>' : '<span class="badge" title="付费模型">付费</span>') : '<span class="badge">未注册</span>')}
      ${infoTip(id)}
    </span>
    <button class="btn btn-ghost btn-sm danger-hover" style="margin-left:auto" title="从池中移除" onclick="removeFromPool('${jsq(name)}', '${jsq(id)}')">✕</button>
  </div>`;
}

/* 条目信息（i 气泡：data-tip 多行浮层，共享 hmg.js 的 ⓘ 机制） */
function infoTip(id) {
  if (id.startsWith("pool:")) {
    const pname = id.slice(5);
    const p = poolLookup[pname];
    const members = p ? (p.model_ids || []) : [];
    const rows = [["类型", "嵌套子池"], ["择优模式", p && p.auto_order ? "自动（按延迟）" : "按设定顺序"], ["包含项数", String(members.length)], ...members.map((mid, idx) => [`${idx + 1}`, mid])];
    return `<i class="i-tip" data-tip="池：${esc(pname)}\n${rows.map(r => esc(r[0]) + "：" + esc(r[1])).join("\n")}">i</i>`;
  }
  const m = modelLookup[id];
  if (!m) return `<i class="i-tip" data-tip="${esc(id)}\n该接口未在模型库中注册">i</i>`;
  const p = providerLookup[m.provider_id];
  const rows = [
    ["协议", protocolLabel(p ? p.protocol : m.provider)],
    ["模型名", m.name],
    ["Base URL", p ? p.base_url : (m.base_url || "")],
    ["所属供应商", p ? `${p.name}（${p.id}）` : "—（独立内联）"],
    ["收费标注", m.is_free ? "免费" : "付费"],
    ["模态", m.modality === "embedding" ? "embedding（嵌入模型）" : m.modality === "rerank" ? "rerank（重排模型）" : m.modality === "vision" ? "多模态" : "纯文本"],
    ["令牌", m.token_type === "one_time" ? "一次性" : (m.token_type === "local" ? "本地模型" : (m.token_type === "rolling_5h" ? "5h 限额" : (m.token_type === "all_day" ? "付费·全天可用" : (m.token_type === "idle_only" ? "付费·仅闲时可用" : "每日"))))],
    [(m.token_type === "local" ? "本地用量（不计费）" : (m.token_type === "rolling_5h" ? "5h 窗口限额" : "每日上限")), m.daily_token_limit ? m.daily_token_limit.toLocaleString() + (m.billing_mode === "request" ? " 次" : " Token") : "不限"],
    ["RPM/TPM", `${m.rpm_limit || "∞"}/${m.tpm_limit || "∞"}`],
    ["并发", String(m.max_concurrency)],
    ["超时", m.timeout_seconds == null ? "默认（120s）" : (m.timeout_seconds === 0 ? "无限等待" : m.timeout_seconds + "s")],
  ];
  return `<i class="i-tip" data-tip="${esc(m.id)}\n${rows.map(r => esc(r[0]) + "：" + esc(r[1])).join("\n")}">i</i>`;
}

function collectPoolModels(poolName, pools, visiting = {}) {
  if (visiting[poolName]) return [];
  visiting[poolName] = true;
  const out = [];
  const pool = pools[poolName];
  (pool?.model_ids || []).forEach(id => {
    if (id.startsWith("pool:")) out.push(...collectPoolModels(id.slice(5), pools, visiting));
    else out.push(id);
  });
  return out;
}

async function openSingleMode() {
  const data = await api("/admin/pools/auto/single_override");
  const cur = data && data.model_id ? data.model_id : "";
  const models = collectPoolModels("auto", poolLookup);
  singleModal = HMG.modal({
    title: "🎯 单模型锁定 · auto",
    body: `
      <div class="hint" style="margin-bottom:12px">开启后该池只使用选定模型，其余全部跳过；池内布局不变。</div>
      <div class="fg"><label>选择模型</label><select id="single-sel" class="inp"><option value="">— 选择模型 —</option>
        ${models.map(mid => `<option value="${esc(mid)}" ${mid === cur ? "selected" : ""}>${modelLookup[mid] ? esc(mid + "（" + modelLookup[mid].name + "）") : esc(mid)}</option>`).join("")}
      </select></div>`,
    footer: [

async function setSlowThreshold(name, val) {
  const v = parseInt(val);
  if (isNaN(v) || v < 0) { toast("阈值必须为非负数字", "err"); loadPools(); return; }
  const data = await api("/admin/pools");
  if (!data || !data.pools[name]) return;
  const ok = await api("/admin/pools/" + pathEnc(name), { method: "PUT", body: JSON.stringify({ model_ids: data.pools[name].model_ids, slow_latency_threshold: v }) });
  if (ok) { toast(v === 0 ? name + " 延迟阈值：不限制" : name + " 延迟阈值：" + v + "ms", "ok"); loadPools(); }
}
function updateThHint(name, val) {
  const v = parseInt(val);
  const hint = document.querySelector('[data-th-hint="' + name.replace(/"/g, '\\"') + '"]');
  if (hint) {
    if (isNaN(v) || v <= 0) { hint.textContent = "不限速"; hint.className = "th-hint ok"; }
    else if (v <= 1000) { hint.textContent = "> " + (v / 1000).toFixed(1) + "s 即降级（激进）"; hint.className = "th-hint warn"; }
    else if (v <= 3000) { hint.textContent = "> " + (v / 1000).toFixed(1) + "s 即降级"; hint.className = "th-hint ok"; }
    else { hint.textContent = "> " + (v / 1000).toFixed(1) + "s 即降级（宽松）"; hint.className = "th-hint"; }
  }
}
async function openFallbackTargets() {

      <div style="max-height:300px;overflow-y:auto">${rows || '<div class="hint">暂无其他池</div>'}</div>`,

  const ok = await api("/admin/pools/fallback_targets", { method: "PUT", body: JSON.stringify({ pool_names: checked }) });
  if (ok) {
    fbModal.close();

async function speedPool(name) {
  const data = await api("/admin/pools");
  if (!data) return;
  const pool = data.pools[name];
  const models = pool ? collectPoolModels(name, data.pools) : [];
  if (!models.length) { toast("该池无模型可测速", "err"); return; }
  const speedCache = JSON.parse(localStorage.getItem("gw_speed") || "{}");
  models.forEach(id => delete speedCache[id]);
  localStorage.setItem("gw_speed", JSON.stringify(speedCache));
  toast("测速中：" + name + "（" + models.length + " 个模型）");
  const res = await api("/speedtest", { method: "POST", body: JSON.stringify({ model_ids: models }) });
  if (res) {
    res.results.forEach(r => {
      if (r.status === "ok") speedCache[r.model_id] = { status: "ok", latency_ms: r.latency_ms, tps: r.tps };
      else speedCache[r.model_id] = { status: r.status };
    });
    localStorage.setItem("gw_speed", JSON.stringify(speedCache));
    toast("测速完成", "ok");
  }
  loadPools();
}

/* ── 拖拽：池内条目排序 + 池卡片排序 ── */
async function savePoolItemOrder(items) {
  const name = items.dataset.pool;
  const ids = [...items.querySelectorAll(".pool-item")].map(el => el.dataset.id);
  const pdata = await api("/admin/pools");
  if (!pdata || !pdata.pools[name]) return;
  const ok = await api("/admin/pools/" + pathEnc(name), { method: "PUT", body: JSON.stringify({ model_ids: ids }) });
  if (ok) { toast("池内顺序已更新", "ok"); }
}
function bindDrag() {
  document.querySelectorAll(".pool-items").forEach(items => {
    if (items.dataset.dragBound) return;
    items.dataset.dragBound = "1";
    let dragged = null, pendingEv = null;
    items.addEventListener("dragstart", e => {
      const item = e.target.closest(".pool-item");
      if (!item) return;
      e.stopPropagation();
      dragged = item;
      item.classList.add("dragging");
      requestAnimationFrame(() => { if (item.classList.contains("dragging")) item.style.opacity = "0.4"; });  // 异步变淡：拖影快照保持全不透明；dragging 已不在=极速落下，放弃变淡
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", item.dataset.id); } catch (err) {}  // Firefox 无 data 不起拖
    });
    items.addEventListener("dragover", e => {
      e.preventDefault();
      const after = e.target.closest(".pool-item");
      if (!dragged || !after || after === dragged) return;
      e.dataTransfer.dropEffect = "move";
      pendingEv = { after, y: e.clientY };
      if (items._dragRaf) return;  // rAF 合帧：只保留最新落点意图
      items._dragRaf = requestAnimationFrame(() => {
        items._dragRaf = null;
        if (!pendingEv || !dragged) return;
        const { after, y } = pendingEv; pendingEv = null;
        if (!items.contains(after)) return;
        const rect = after.getBoundingClientRect();
        const before = y < rect.top + rect.height / 2;
        HMG.flipMove(items, ".pool-item", () =>
          after.parentNode.insertBefore(dragged, before ? after : after.nextSibling));
      });
    });
    items.addEventListener("dragend", async e => {
      e.stopPropagation();
      if (!dragged) return;
      dragged.classList.remove("dragging");
      dragged.style.opacity = "";
      dragged = null;
      await savePoolItemOrder(items);
    });
    if (HMG.isTouch) {
      items.addEventListener("click", async e => {
        e.stopPropagation();
        if (e.target.closest("button, .i-tip")) return;
        const item = e.target.closest(".pool-item");
        if (!item) return;
        const prev = item.previousElementSibling;
        if (!prev || !prev.matches(".pool-item")) return;
        HMG.flipMove(items, ".pool-item", () => item.parentNode.insertBefore(item, prev));
        await savePoolItemOrder(items);
      });
    }
  });
}
async function savePoolCardOrder(list) {
  grpSyncFromDOM("poolGroups", list, "[data-pool-card]", "poolCard");
  const domNames = [...list.querySelectorAll("[data-pool-card]")].map(el => el.dataset.poolCard);
  const allOthers = Object.keys(poolLookup || {}).filter(n => n !== "auto" && n !== "兜底池");
  const names = domNames.concat(allOthers.filter(n => !domNames.includes(n)));
  const ok = await api("/admin/pools/reorder", { method: "PUT", body: JSON.stringify({ pool_names: names }) });
  if (ok) { toast("池顺序已更新", "ok"); } else { loadPools(); }  // 仅失败回拉：DOM 已是所存顺序，重渲只会闪放入场动画
}
function bindPoolDrag() {
  const list = document.getElementById("pool-list");
  if (!list) return;
  if (list.dataset.dragBoundPool) return;
  list.dataset.dragBoundPool = "1";
  let dragged = null, pendingEv = null;
  list.addEventListener("dragstart", e => {
    const card = e.target.closest("[data-pool-card]");
    if (!card || card.dataset.poolCard === "auto") { e.preventDefault(); return; }
    dragged = card;
    card.classList.add("dragging");
    requestAnimationFrame(() => { if (card.classList.contains("dragging")) card.style.opacity = "0.4"; });  // 异步变淡：拖影快照保持全不透明；dragging 已不在=极速落下，放弃变淡
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", card.dataset.poolCard); } catch (err) {}  // Firefox 无 data 不起拖
  });
  list.addEventListener("dragover", e => {
    e.preventDefault();
    if (!dragged) return;
    e.dataTransfer.dropEffect = "move";
    if (e.target.closest(".pool-item")) return;
    pendingEv = { card: e.target.closest("[data-pool-card]"), sec: e.target.closest(".grp-section"), y: e.clientY };
    if (list._dragRafPool) return;  // rAF 合帧：只保留最新落点意图
    list._dragRafPool = requestAnimationFrame(() => {
      list._dragRafPool = null;
      if (!pendingEv || !dragged || !list.contains(dragged)) return;
      const { card, sec, y } = pendingEv; pendingEv = null;
      if (card && card !== dragged) {
        const rect = card.getBoundingClientRect();
        const before = y < rect.top + rect.height / 2;
        // 禁止把被拖池插到 auto 之前 / 兜底池 之后（后端 reorder 强制 auto 第一、兜底池最后）
        if (before && card.dataset.poolCard === "auto") return;
        if (!before && card.dataset.poolCard === "兜底池") return;
        HMG.flipMove(list, "[data-pool-card]", () =>
          card.parentNode.insertBefore(dragged, before ? card : card.nextSibling));
        return;
      }
      if (sec) {
        const body = sec.querySelector(".grp-body");
        if (body && body !== dragged.parentNode)
          HMG.flipMove(list, "[data-pool-card]", () => body.appendChild(dragged));
      }
    });
  });
  list.addEventListener("dragend", async e => {
    if (!dragged) return;
    dragged.classList.remove("dragging");
    dragged.style.opacity = "";
    dragged = null;
    await savePoolCardOrder(list);
  });
  if (HMG.isTouch) {
    list.addEventListener("click", async e => {
      if (e.target.closest("button, input, select, label, .switch, .threshold-ctl, .i-tip")) return;
      const card = e.target.closest("[data-pool-card]");
      if (!card) return;
      const name = card.dataset.poolCard;
      if (name === "auto" || name === "兜底池") return;
      let prev = card.previousElementSibling;
      while (prev && !prev.matches("[data-pool-card]")) prev = prev.previousElementSibling;
      if (!prev) return;
      if (prev.dataset.poolCard === "auto") { toast("auto 池固定在第一位"); return; }
      list.insertBefore(card, prev);
      await savePoolCardOrder(list);
    });
  }
}
