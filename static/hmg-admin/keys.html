<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 密钥 · HMG Admin</title>
<script>
/* 主题引导：渲染前定 data-theme，防闪白（跟随系统 → localStorage 手动值优先） */
(function(){try{var t=localStorage.getItem('hmg_theme');if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<link rel="stylesheet" href="/hmg-admin/assets/hmg.css?v=__GATEWAY_VERSION__">
<style>
/* ── 本页私有：密钥卡片与创建弹窗 ── */
.key-secret { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--ink-muted); margin-top: 4px; overflow-wrap: anywhere; user-select: all; }
.key-card .card-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
/* 授权池 chip：换行发生在 chip 之间而非名字中间（换行治理）；身份色点与日志行同相位 */
.pool-chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.pool-chip { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--hairline); font-size: 12px; white-space: nowrap; }
.pool-chip .hmg-av-dot { margin-right: 5px; }
.btn-ok-flash { color: var(--ok-ink) !important; border-color: var(--ok-ink) !important; }
.key-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 8px 16px; font-size: 13px; }
.key-grid b { font-weight: 500; overflow-wrap: anywhere; }
.kv-line { display: flex; gap: 6px; min-width: 0; }
.kv-line > span:first-child { color: var(--ink-subtle); flex: none; }
.pool-check { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hairline); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; min-height: 34px; transition: border-color 130ms ease, background-color 130ms ease; }
.pool-check:hover { border-color: var(--hairline-strong); }
.pool-check:has(input:checked) { border-color: rgba(94, 106, 210, .55); background: var(--acc-tint); }
.pool-check input { accent-color: var(--accent); }
.checkbox-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.kv b { color: var(--ink); font-weight: 500; }
.bar-inline { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; flex-wrap: wrap; row-gap: 2px; }
.bar-inline .num { white-space: nowrap; }
.bar-inline .bar { width: 90px; flex: none; }
.bar-inline .mono:last-child { white-space: nowrap; }
.usage-tip { position: absolute; pointer-events: none; background: var(--surface-3); border: 1px solid var(--hairline-strong); border-radius: 6px; padding: 4px 9px; font-size: 12px; white-space: nowrap; z-index: 5; box-shadow: var(--shadow-pop); }
@media (max-width: 767px) {
  .key-grid { grid-template-columns: minmax(0, 1fr); }   /* minmax(0,1fr)：auto 最小值会被长 Key 名/数字顶爆轨道（v2.17.18） */
}
/* 用量行内容最宽（限额数字+进度条+百分比+徽章），独占整行防窄列断行 */
.usage-line { grid-column: 1 / -1; }
</style>
</head>
<body data-page="keys">
<div id="hmg-topbar"></div>
<aside id="hmg-sidebar"></aside>
<div id="hmg-drawermask"></div>
<main class="hmg-main">
  <div class="page-head">
    <h1>API 密钥</h1><span class="sub">管理员密钥无限制；用户密钥仅可访问授权池并按限额计量；到期自动轮换（旧密钥宽限期 20%，1~24h）</span><span class="sp"></span>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="showAddKey()">＋ 创建密钥</button>
    </div>
  </div>
  <div id="key-list" class="stagger"><div class="empty loading">加载中…</div></div>
</main>
<script src="/hmg-admin/assets/hmg.js?v=__GATEWAY_VERSION__"></script>
<script>
"use strict";
HMG.renderShell();
/* ═══════════ API 密钥页（业务逻辑自 hfadmin 移植，API 零改动）═══════════ */
const api = HMG.api, esc = HMG.esc, jsq = HMG.jsq, pathEnc = HMG.pathEnc, toast = HMG.toast;
let editingKeyId = null;
let keyModal = null, createdModal = null, usageModal = null, rotModal = null;
function setInnerIfChanged(el, html) {
  if (el.__lastHtml === html) return false;
  el.__lastHtml = html;
  el.innerHTML = html;
  return true;
}

function keyTypeBadge(t) { return t === "admin" ? '<span class="badge badge-err">管理员</span>' : '<span class="badge badge-acc">用户</span>'; }
function keyLimitText(k) {
  if (k.type === "admin" || !k.token_type || !k.limit_amount) return '<span class="mono" style="color:var(--ink-subtle)">无限制</span>';
  const unit = k.billing_mode === "request" ? "次" : "tokens";
  const tname = { daily: "每日", rolling_5h: "5h", one_time: "一次性" }[k.token_type] || k.token_type;
  const u = k.usage || {};
  const pct = u.limit > 0 ? Math.min(100, u.used / u.limit * 100) : 0;
  const cls = u.exhausted ? "err" : pct >= 75 ? "warn" : "ok";
  const resetTag = u.window_reset ? '<span class="badge badge-ok" style="margin-left:4px">窗口已刷新</span>' : "";
  return `<span class="bar-inline"><span class="mono num">${tname}·${(u.used || 0).toLocaleString()}/${u.limit.toLocaleString()}${unit}</span>
    <span class="bar"><i class="${cls}" style="width:${pct}%"></i></span><span class="mono num">${pct.toFixed(0)}%</span>
    ${u.exhausted ? '<span class="badge badge-err">已用尽</span>' : ""}${resetTag}</span>`;
}
function keyExpiryText(k) {
  const exp = k.expire_seconds > 0 ? (k.rotated_at || k.created_at || 0) + k.expire_seconds : null;
  const grace = k.previous_secret_expires;
  let rot = "";
  if (grace && grace > Date.now() / 1000) rot += `<span class="mono" style="color:var(--ink-subtle)">· 旧密钥宽限至 ${new Date(grace * 1000).toLocaleString("zh-CN", { hour12: false })}</span>`;
  if (k.rotated_at) rot += `<span class="mono" style="color:var(--ink-subtle)">· 上次轮换 ${new Date(k.rotated_at * 1000).toLocaleString("zh-CN", { hour12: false })}</span>`;
  if (exp === null) return `<b>永不过期</b>${rot}`;
  const remain = exp - Date.now() / 1000;
  if (remain > 0) return `<b>距到期 ${Math.floor(remain / 3600)}h ${Math.floor((remain % 3600) / 60)}m</b> ${rot}`;
  return `<b style="color:var(--danger)">已到期（自动轮换中）</b> ${rot}`;
}
async function loadKeys() {
  const data = await api("/admin/keys");
  const el = document.getElementById("key-list");
  if (!data) return;
  const keyHtml = data.keys.map(k => `
    <div class="card key-card">
      <div class="card-head">
        <div class="grow" style="min-width:200px">
          <div class="card-title">${HMG.avatar(k.name, true)} ${esc(k.name)} <span class="mono" style="color:var(--ink-subtle);font-size:12px">#${k.id}</span></div>
          <div class="key-secret">${esc(k.secret)}</div>
        </div>
        <div class="row wrap">
          ${keyTypeBadge(k.type)}
          ${k.enabled ? '<span class="badge badge-ok">启用</span>' : '<span class="badge badge-err">禁用</span>'}
          <button class="btn btn-ghost btn-sm" onclick="copyKey('${jsq(k.secret)}', this)">复制</button>
          <button class="btn btn-ghost btn-sm" onclick="showEditKey(${k.id})">编辑</button>
          <button class="btn btn-ghost btn-sm" onclick="showKeyUsage(${k.id})">用量历史</button>
          <button class="btn btn-ghost btn-sm" onclick="showKeyRotations(${k.id})">轮换日志</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleKey(${k.id},${k.enabled ? 0 : 1})">${k.enabled ? "禁用" : "启用"}</button>
          <button class="btn btn-danger btn-sm" onclick="delKey(${k.id})">删除</button>
        </div>
      </div>
      <div class="key-grid">
        <div class="kv-line"><span>授权池</span><b class="pool-chips">${k.type === "admin" ? "全部" : (k.allowed_pools || []).map(p => `<span class="pool-chip">${HMG.avatarDot(p)}${esc(p)}</span>`).join("") || "无"}</b></div>
        <div class="kv-line"><span>专属池</span><b>${k.own_pool ? esc(k.own_pool) : "无"}</b></div>
        <div class="kv-line usage-line"><span>用量</span><b>${keyLimitText(k)}</b></div>
        <div class="kv-line"><span>过期</span><b>${keyExpiryText(k)}</b></div>
        <div class="kv-line"><span>创建时间</span><b class="mono">${new Date(k.created_at * 1000).toLocaleString("zh-CN", { hour12: false })}</b></div>
      </div>
    </div>`).join("") || '<div class="empty">暂无 API 密钥，点击右上角创建。</div>';
  // 管理员（服务器密钥）固定行：decision_log 口径的用量历史（伪 Key #0）
  const adminCard = `
    <div class="card key-card" style="border-style:dashed">
      <div class="card-head">
        <div>
          <div class="card-title">管理员（服务器密钥） <span class="mono" style="color:var(--ink-subtle);font-size:12px">#0</span></div>
          <div class="key-secret">config.json server.api_key · 无限额 · 用量按调用记录口径（decision_log）</div>
        </div>
        <div class="row">
          <span class="badge badge-err">管理员</span>
          <button class="btn btn-ghost btn-sm" onclick="showKeyUsage(0)">用量历史</button>
        </div>
      </div>
    </div>`;
  setInnerIfChanged(el, adminCard + keyHtml);
}
let keyPoolCache = [];
async function loadKeyPools() {
  const data = await api("/admin/pools");
  keyPoolCache = data ? Object.keys(data.pools).filter(n => n !== "兜底池") : [];
}
function renderPoolCheckboxes(checkedArr) {
  const box = document.getElementById("k-pools-checkboxes");
  box.innerHTML = keyPoolCache.map(p => {
    const checked = (checkedArr || []).includes(p) ? " checked" : "";
    return `<label class="pool-check"><input type="checkbox" value="${esc(p)}" data-pool="${esc(p)}"${checked}><span>${esc(p)}</span></label>`;
  }).join("") || '<div class="hint">暂无模型池</div>';
}
function onKeyTypeChange() {
  const isUser = document.getElementById("k-type").value === "user";
  document.getElementById("k-pool-fields").style.display = isUser ? "" : "none";
  const isEdit = editingKeyId !== null;
  document.getElementById("k-own-pool-fields").classList.toggle("hidden", !(isEdit && isUser));
  onKeyLimitTypeChange();
}
function onKeyLimitTypeChange() {
  const ttype = document.getElementById("k-token-type").value;
  const hint = document.getElementById("k-limit-hint");
  const label = document.getElementById("k-limit-label");
  const hints = {
    daily: "每日 00:00 自动刷新窗口，无需手动重置；只需填写每天限额数值。",
    rolling_5h: "5h 窗口自动滚动刷新（首次调用起算 5 小时），无需手动填时长；只需填写窗口内限额数值。",
    one_time: "一次性限额：用完即永久失效，不刷新。",
    "": "不限量：不限制用量。",
  };
  hint.textContent = hints[ttype] || "";
  hint.classList.toggle("hidden", !hints[ttype]);
  label.textContent = ttype === "daily" ? "每日限额数值（0=不限）"
    : ttype === "rolling_5h" ? "5h 窗口限额数值（0=不限）"
    : ttype === "one_time" ? "一次性限额数值（0=不限）"
    : "限额数值（0=不限）";
}
function kformHtml() {
  return `
  <form id="kform" onsubmit="submitKey(event)">
    <div class="frm-row">
      <div class="fg"><label>密钥名称</label><input name="name" class="inp" required placeholder="如：我的应用"></div>
      <div class="fg"><label>密钥类型</label><select name="type" id="k-type" class="inp" onchange="onKeyTypeChange()"><option value="user">用户密钥（受限）</option><option value="admin">管理员密钥（无限制）</option></select></div>
    </div>
    <div id="k-pool-fields">
      <div class="fg"><label>授权模型池（用户密钥仅可访问以下池）</label><div class="checkbox-grid" id="k-pools-checkboxes"></div></div>
      <div class="frm-row3">
        <div class="fg"><label>限额类型</label><select name="token_type" id="k-token-type" class="inp" onchange="onKeyLimitTypeChange()"><option value="">不限量</option><option value="daily">每日刷新</option><option value="rolling_5h">5h 限额</option><option value="one_time">一次性</option></select></div>
        <div class="fg"><label>计费模式</label><select name="billing_mode" class="inp"><option value="token">按 Token</option><option value="request">按请求次数</option></select></div>
        <div class="fg"><label id="k-limit-label">限额数值（0=不限）</label><input name="limit_amount" type="number" class="inp" value="0" min="0"></div>
      </div>
      <div id="k-limit-hint" class="hint hidden" style="margin-bottom:13px"></div>
      <div class="fg"><label>密钥到期时长（小时，0=永不过期；到期自动轮换新密钥，与上方限额窗口无关）</label><input name="expire_hours" type="number" class="inp" value="0" min="0"></div>
    </div>
    <div id="k-own-pool-fields" class="hidden" style="margin-top:14px;border-top:1px solid var(--hairline);padding-top:12px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">用户专属模型池</div>
      <div id="k-own-pool-status" style="font-size:12.5px;color:var(--ink-subtle)">加载中...</div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="keyModal.close()">取消</button>
      <button type="submit" class="btn btn-primary" id="k-submit-btn">创建</button>
    </div>
  </form>`;
}
async function showAddKey() {
  editingKeyId = null;
  keyModal = HMG.modal({ title: "创建 API 密钥", body: kformHtml(), maskClose: false });
  document.getElementById("k-submit-btn").textContent = "创建";
  await loadKeyPools();
  renderPoolCheckboxes([]);
  onKeyTypeChange();
}
async function showEditKey(id) {
  const data = await api("/admin/keys");
  if (!data) return;
  const k = data.keys.find(x => x.id === id);
  if (!k) return;
  editingKeyId = id;
  keyModal = HMG.modal({ title: "编辑 API 密钥", body: kformHtml(), maskClose: false });
  const form = document.getElementById("kform");
  form.name.value = k.name;
  form.type.value = k.type;
  form.token_type.value = k.token_type || "";
  form.billing_mode.value = k.billing_mode || "token";
  form.limit_amount.value = k.limit_amount || 0;
  form.expire_hours.value = k.expire_seconds ? Math.floor(k.expire_seconds / 3600) : 0;
  document.getElementById("k-submit-btn").textContent = "保存";
  await loadKeyPools();
  renderPoolCheckboxes(k.type === "admin" ? [] : (k.allowed_pools || []));
  onKeyTypeChange();
  loadKeyOwnPool();
}
async function submitKey(e) {
  e.preventDefault();
  const form = document.getElementById("kform");
  const body = Object.fromEntries(new FormData(form).entries());
  body.limit_amount = parseInt(body.limit_amount) || 0;
  body.expire_seconds = (parseInt(body.expire_hours) || 0) * 3600;
  delete body.expire_hours;
  body.allowed_pools = [...document.querySelectorAll("#k-pools-checkboxes input:checked")].map(x => x.getAttribute("data-pool") || x.value);
  let data;
  if (editingKeyId) data = await api("/admin/keys/" + editingKeyId, { method: "PUT", body: JSON.stringify(body) });
  else data = await api("/admin/keys", { method: "POST", body: JSON.stringify(body) });
  if (!data) return;
  keyModal.close();
  if (!editingKeyId && data.key && data.key.secret) {
    createdModal = HMG.modal({
      title: "🔑 密钥已创建（仅显示一次）",
      body: `<div class="fg"><label>请立即复制保存</label><input id="key-created-value" class="inp mono" readonly value="${esc(data.key.secret)}"></div>`,
      footer: [
        { label: "复制", cls: "btn btn-primary", onClick: () => copyCreatedKey() },
        { label: "关闭", cls: "btn btn-secondary", onClick: ({ close }) => close() },
      ],
      maskClose: false,
    });
  } else {
    toast("密钥已更新", "ok");
  }
  loadKeys();
}
function copyCreatedKey() {
  const v = document.getElementById("key-created-value");
  v.select(); document.execCommand("copy");
  toast("密钥已复制", "ok");
}
function copyKey(s, btn) {
  const ta = document.createElement("textarea");
  ta.value = s; document.body.appendChild(ta); ta.select();
  document.execCommand("copy"); ta.remove();
  toast("密钥已复制", "ok");
  if (btn) {   // 按钮文本态反馈：已复制 ✓ 1.2s 后还原（emil：操作要有回声）
    if (btn.__copyT) clearTimeout(btn.__copyT);
    btn.textContent = "已复制 ✓"; btn.classList.add("btn-ok-flash");
    btn.__copyT = setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("btn-ok-flash"); }, 1200);
  }
}
async function toggleKey(id, enabled) {
  const ok = await api("/admin/keys/" + id, { method: "PUT", body: JSON.stringify({ enabled: !!enabled }) });
  if (ok) { toast(enabled ? "已启用" : "已禁用", "ok"); loadKeys(); }
}
async function delKey(id) {
  if (!await HMG.confirm("确定删除该 API 密钥吗？使用它的客户端将立即失效。", { danger: true, okLabel: "删除" })) return;
  const ok = await api("/admin/keys/" + id, { method: "DELETE" });
  if (ok) { toast("密钥已删除", "ok"); loadKeys(); }
}
/* ── 专属池 ── */
async function loadKeyOwnPool() {
  const st = document.getElementById("k-own-pool-status");
  st.innerHTML = "加载中...";
  if (editingKeyId === null) return;
  const data = await api("/admin/keys/" + editingKeyId + "/pool");
  if (!data) return;
  if (!data.pool) {
    st.innerHTML = `尚未创建专属模型池。
      <div class="row" style="margin-top:8px">
        <input id="k-own-pool-name" class="inp" placeholder="专属池名称" style="flex:1">
        <button class="btn btn-primary btn-sm" onclick="createKeyOwnPool()">创建</button>
      </div>
      <div class="hint" style="margin-top:5px">创建后自动加入该密钥的授权池；可在「模型池」页切换到专属池模式编辑。</div>`;
  } else {
    st.innerHTML = `专属池：<b class="mono" style="color:var(--accent-hover)">${esc(data.pool.name)}</b>（${(data.pool.model_ids || []).length} 个模型）
      <div style="margin-top:8px">
        <button class="btn btn-danger btn-sm" data-icon="trash" onclick="deleteKeyOwnPool()">删除专属池</button>
        <span class="hint" style="margin-left:8px;display:inline">编辑请在「模型池」页切换到专属池模式</span>
      </div>`;
  }
}
async function createKeyOwnPool() {
  const name = document.getElementById("k-own-pool-name").value.trim();
  if (!name) { toast("请输入专属池名称", "err"); return; }
  const data = await api("/admin/keys/" + editingKeyId + "/pool", { method: "POST", body: JSON.stringify({ name }) });
  if (!data) return;
  toast("专属池已创建", "ok");
  loadKeyOwnPool(); loadKeys();
}
async function deleteKeyOwnPool() {
  if (!await HMG.confirm("确定删除该密钥的专属模型池吗？删除后不可恢复。", { danger: true, okLabel: "删除" })) return;
  const data = await api("/admin/keys/" + editingKeyId + "/pool", { method: "DELETE" });
  if (!data) return;
  toast("专属池已删除", "ok");
  loadKeyOwnPool(); loadKeys();
}
/* ── 用量历史（24h/3d/7d/30d 档位 + 单调三次插值 SVG 曲线 + 最近调用表） ── */
let usageKeyId = null, usageRange = "24h";
const USAGE_RANGES = { "24h": { nDays: 2, title: "近 24 小时" }, "3d": { nDays: 3, title: "近 3 天" }, "7d": { nDays: 7, title: "近 7 天" }, "30d": { nDays: 30, title: "近一个月" } };
function setUsageRange(r) {
  usageRange = USAGE_RANGES[r] ? r : "24h";
  document.querySelectorAll("#usage-range-seg button").forEach(b => b.classList.toggle("on", b.dataset.r === usageRange));
  loadKeyUsage();
}
function showKeyUsage(id) {
  usageKeyId = id;
  const rg = USAGE_RANGES[usageRange] || USAGE_RANGES["24h"];
  usageModal = HMG.modal({
    title: (id === 0 ? "管理员（服务器密钥）" : "API Key #" + id) + " · 用量历史",
    wide: true,
    body: `
      <div class="seg" id="usage-range-seg" style="margin:2px 0 10px">
        <button class="on" data-r="24h" onclick="setUsageRange('24h')">24小时</button>
        <button data-r="3d" onclick="setUsageRange('3d')">近3天</button>
        <button data-r="7d" onclick="setUsageRange('7d')">近7天</button>
        <button data-r="30d" onclick="setUsageRange('30d')">近一个月</button>
      </div>
      <div class="row" style="margin-bottom:10px">
        <span id="usage-range-label" class="mono num" style="font-size:13px;font-weight:600;color:var(--accent-hover)">近 24 小时</span>
        <span class="grow"></span>
        <span style="font-size:13px;color:var(--ink-subtle)"><span id="usage-total-cap">当日总量</span>：<b id="usage-total" class="mono num" style="color:var(--ink)">0</b></span>
      </div>
      <div id="usage-hours" style="position:relative"></div>
      <div id="usage-calls"></div>`,
    footer: [{ label: "关闭", cls: "btn btn-secondary", onClick: ({ close }) => close() }],
  });
  usageModal.body.querySelectorAll("#usage-range-seg button").forEach(b => b.classList.toggle("on", b.dataset.r === usageRange));
  loadKeyUsage();
}
async function loadKeyUsage() {
  const el = document.getElementById("usage-hours");
  const rangeEl = document.getElementById("usage-range-label");
  const totalEl = document.getElementById("usage-total");
  if (!el || usageKeyId === null || usageKeyId === undefined) return;
  el.innerHTML = '<div class="hint">加载中...</div>';
  totalEl.textContent = "…";
  const fmtDay = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const rg = USAGE_RANGES[usageRange] || USAGE_RANGES["24h"];
  const now = new Date();
  const dayList = [];
  for (let i = rg.nDays - 1; i >= 0; i--) dayList.push(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));
  const tables = await Promise.all(dayList.map(dt => api("/admin/keys/" + usageKeyId + "/usage?date=" + fmtDay(dt))));
  if (tables.some(t => !t)) return;
  const titleEl = document.querySelector(".modal-head .t");
  if (titleEl) titleEl.textContent = (usageKeyId === 0 ? "管理员（服务器密钥）" : "API Key #" + usageKeyId) + " · 用量历史";
  const pts = [];
  let rangeTotal = 0;
  if (usageRange === "3d") {
    dayList.forEach((dt, di) => {
      for (let b = 0; b < 4; b++) {
        let used = 0;
        for (let h = b * 6; h < b * 6 + 6; h++) used += tables[di].hours[h].used;
        rangeTotal += used;
        pts.push({ used, dim: di < dayList.length - 1, label: b === 0 ? fmtDay(dt).slice(5) : String(b * 6).padStart(2, "0") + "时",
          tipTxt: fmtDay(dt).slice(5) + " " + String(b * 6).padStart(2, "0") + ":00–" + String(b * 6 + 6).padStart(2, "0") + ":00" });
      }
    });
  } else if (usageRange === "7d" || usageRange === "30d") {
    dayList.forEach((dt, di) => {
      const used = tables[di].hours.reduce((s, x) => s + x.used, 0);
      rangeTotal += used;
      pts.push({ used, dim: di < dayList.length - 1, label: fmtDay(dt).slice(5), tipTxt: fmtDay(dt) });
    });
  } else {
    const td = tables[1], yd = tables[0], curH = now.getHours();
    for (let o = -23; o <= 0; o++) {
      const h = ((curH + o) % 24 + 24) % 24;
      const isToday = curH + o >= 0;
      pts.push({ used: (isToday ? td : yd).hours[h].used, dim: !isToday,
        label: (isToday ? "今" : "昨") + String(h).padStart(2, "0") + "时",
        tipTxt: (isToday ? "今日" : "昨日") + String(h).padStart(2, "0") + ":00" });
    }
  }
  const capEl = document.getElementById("usage-total-cap");
  if (capEl) capEl.textContent = usageRange === "24h" ? "当日总量" : rg.title + "总量";
  if (usageRange === "24h") {
    totalEl.textContent = tables[1].hours.reduce((s, x) => s + x.used, 0).toLocaleString();
    rangeEl.textContent = "近 24 小时（" + fmtDay(dayList[0]).slice(5) + " " + String((now.getHours() + 1) % 24).padStart(2, "0") + ":00 ～ " + fmtDay(dayList[1]).slice(5) + " " + String(now.getHours()).padStart(2, "0") + ":00）";
  } else {
    totalEl.textContent = rangeTotal.toLocaleString();
    rangeEl.textContent = rg.title + "（" + fmtDay(dayList[0]).slice(5) + " ～ " + fmtDay(dayList[dayList.length - 1]).slice(5) + "）";
  }
  const W = Math.max(320, Math.min(760, el.clientWidth || 720)), H = 190, L = 52, R = 14, T = 16, B = 30, n = pts.length;
  const max = Math.max(1, ...pts.map(p => p.used));
  const X = i => L + i * (W - L - R) / (n - 1);
  const Y = v => H - B - v / max * (H - T - B);
  // 单调三次插值（Fritsch–Carlson 完整版：含切线限幅 |tg|≤3·min(相邻斜率)，杜绝越界/负值）
  const dpx = [], mp = [];
  for (let i = 0; i < n - 1; i++) {
    const dx = X(i + 1) - X(i);
    dpx.push(dx);
    mp.push((Y(pts[i + 1].used) - Y(pts[i].used)) / dx);
  }
  const tg = [mp[0]];
  for (let i = 1; i < n - 1; i++) {
    if (mp[i - 1] * mp[i] <= 0) { tg.push(0); continue; }
    const lim = 3 * Math.min(Math.abs(mp[i - 1]), Math.abs(mp[i]));
    const avg = (mp[i - 1] + mp[i]) / 2;
    tg.push(Math.sign(avg) * Math.min(Math.abs(avg), lim));
  }
  tg.push(mp[n - 2]);
  let path = "M " + X(0).toFixed(1) + " " + Y(pts[0].used).toFixed(1);
  for (let i = 0; i < n - 1; i++) {
    const h = dpx[i];
    path += ` C ${(X(i) + h / 3).toFixed(1)} ${(Y(pts[i].used) + tg[i] * h / 3).toFixed(1)}, ${(X(i + 1) - h / 3).toFixed(1)} ${(Y(pts[i + 1].used) - tg[i + 1] * h / 3).toFixed(1)}, ${X(i + 1).toFixed(1)} ${Y(pts[i + 1].used).toFixed(1)}`;
  }
  let svg = [0, 0.5, 1].map(f => {
    const gy = (H - B) - f * (H - T - B);
    const gv = Math.round(max * f);
    const gtxt = gv >= 10000 ? (gv / 10000).toFixed(1) + "万" : gv.toLocaleString();
    return `<line x1="${L}" y1="${gy.toFixed(1)}" x2="${W - R}" y2="${gy.toFixed(1)}" stroke="var(--hairline-strong)" stroke-dasharray="3 4"/><text x="${L - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink-subtle)">${gtxt}</text>`;
  }).join("");
  svg += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>`;
  svg += pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.used).toFixed(1)}" r="2.2" fill="var(--accent)" data-i="${i}"/>`).join("");
  const tickEvery = usageRange === "24h" ? 4 : usageRange === "30d" ? 3 : 1;
  svg += pts.map((p, i) => (i % tickEvery === 0 || i === n - 1) ? `<text x="${X(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="${p.dim ? "var(--ink-tertiary)" : "var(--accent-hover)"}">${p.label}</text>` : "").join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${svg}</svg><div id="usage-tip" class="usage-tip" style="display:none"></div>`;
  const svgEl = el.querySelector("svg");
  const tip = el.querySelector("#usage-tip");
  const dots = svgEl.querySelectorAll("circle");
  const guide = document.createElementNS("http://www.w3.org/2000/svg", "line");
  guide.setAttribute("stroke", "var(--hairline-strong)");
  guide.setAttribute("visibility", "hidden");
  svgEl.insertBefore(guide, svgEl.firstChild);
  svgEl.addEventListener("mousemove", ev => {
    const rct = svgEl.getBoundingClientRect();
    const mx = (ev.clientX - rct.left) * W / rct.width;
    let i = Math.round((mx - L) / ((W - L - R) / (n - 1)));
    i = Math.max(0, Math.min(n - 1, i));
    const p = pts[i];
    guide.setAttribute("x1", X(i)); guide.setAttribute("x2", X(i));
    guide.setAttribute("y1", T); guide.setAttribute("y2", H - B);
    guide.setAttribute("visibility", "visible");
    dots.forEach((d, j) => d.setAttribute("r", j === i ? 4 : 2.2));
    tip.innerHTML = `<b>${esc(p.tipTxt)}</b> 用量 <b style="color:var(--accent-hover)">${p.used.toLocaleString()}</b> tok`;
    tip.style.left = Math.max(0, Math.min(X(i) * (rct.width / W) - 60, rct.width - 140)) + "px";
    tip.style.top = Math.max(0, Y(p.used) * (rct.height / H) - 38) + "px";
    tip.style.display = "block";
  });
  svgEl.addEventListener("mouseleave", () => {
    tip.style.display = "none";
    guide.setAttribute("visibility", "hidden");
    dots.forEach(d => d.setAttribute("r", 2.2));
  });
  if (!window.__usageResizeBound) {
    window.__usageResizeBound = true;
    window.addEventListener("resize", () => {
      if (usageModal && document.body.contains(usageModal.mask) && usageKeyId) loadKeyUsage();
    });
  }
  const cel = document.getElementById("usage-calls");
  if (cel) {
    const cs = await api("/admin/keys/" + usageKeyId + "/calls");
    if (cs && cs.calls) {
      const rows = cs.calls.map(c => {
        const t = new Date(c.ts * 1000).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
        const last = (c.steps || []).slice(-1)[0] || {};
        const res = c.selected ? "✓ " + c.selected : "✗ " + (last.reason || "失败");
        const col = c.selected ? "var(--success)" : "var(--danger)";
        return `<tr><td class="mono">${t}</td><td>${esc(c.pool_name)}</td><td class="mono">${esc(c.requested || "-")}</td><td style="color:${col}">${esc(res)}</td><td class="r mono num">${(c.actual_tokens || 0).toLocaleString()}</td></tr>`;
      }).join("");
      cel.innerHTML = '<div style="font-size:12.5px;color:var(--ink-subtle);margin:10px 0 6px">最近调用记录（≤50 条，仅本 Key）</div>' +
        '<div class="tbl-wrap" style="border:1px solid var(--hairline);border-radius:8px;max-height:240px;overflow:auto"><table class="tbl">' +
        "<thead><tr><th>时间</th><th>池</th><th>请求模型</th><th>结果</th><th class=\"r\">tokens</th></tr></thead><tbody>" + rows + "</tbody></table></div>";
    } else { cel.innerHTML = ""; }
  }
}
/* ── 轮换日志 ── */
async function showKeyRotations(id) {
  const data = await api("/admin/keys/" + id + "/rotations");
  if (!data) return;
  let listHtml;
  if (!data.rotations || !data.rotations.length) {
    listHtml = '<div class="hint">暂无轮换记录（密钥未到期或从未轮换）。</div>';
  } else {
    listHtml = data.rotations.map(r => `
      <div class="row" style="padding:7px 0;border-bottom:1px solid var(--hairline);flex-wrap:wrap">
        <span class="mono" style="font-size:11.5px">${new Date(r.ts * 1000).toLocaleString("zh-CN", { hour12: false })}</span>
        <span style="color:var(--ink-tertiary)">→</span>
        <span class="mono badge badge-warn">${esc(r.old_prefix)}…</span>
        <span style="color:var(--ink-tertiary)">→</span>
        <span class="mono badge badge-ok">${esc(r.new_prefix)}…</span>
        <span class="right" style="color:var(--ink-subtle);font-size:11px">${esc(r.note || "")}</span>
      </div>`).join("");
  }
  HMG.modal({
    title: "密钥 #" + id + " · 轮换审计日志",
    body: `<div style="font-size:12.5px">${listHtml}</div>`,
    footer: [{ label: "关闭", cls: "btn btn-secondary", onClick: ({ close }) => close() }],
  });
}

/* ═══════════ 初始化 ═══════════ */
loadKeys();
